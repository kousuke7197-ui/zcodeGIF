name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  smoke-test:
    name: Electron startup
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Verify Electron startup
        timeout-minutes: 2
        run: |
          # 启动 Electron，等待 10 秒后检查进程是否存活
          # 存活 = 启动成功；已退出 = 启动失败
          npm run start &
          PID=$!
          sleep 10
          if kill -0 $PID 2>/dev/null; then
            echo "Electron started successfully (terminated after 10s)."
            kill $PID 2>/dev/null
            wait $PID 2>/dev/null
            exit 0
          else
            wait $PID 2>/dev/null
            EXIT_CODE=$?
            echo "Electron exited early with code $EXIT_CODE."
            exit 1
          fi
